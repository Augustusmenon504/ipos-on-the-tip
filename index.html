<style>
/* Layout: sticky top nav over hash-routed views; dark-first in the original project's slate + green, with a light theme mirror */
:root{
  --bg:#182527; --surface:#1f3033; --surface2:#253a3e; --ink:#eef5f3; --muted:#9db3ae; --line:#2f4549;
  --accent:#09BA74; --accent-ink:#06281b; --accent-soft:#16463a; --up:#2ee59d; --down:#ff7b7b; --warn:#f2c14e;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f7f5; --surface:#ffffff; --surface2:#e9f2ee; --ink:#14211f; --muted:#5a6d68; --line:#d5e2dc;
  --accent:#078f5a; --accent-ink:#ffffff; --accent-soft:#d6f2e6; --up:#0b8a55; --down:#c23b3b; --warn:#9a6a00; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f7f5; --surface:#ffffff; --surface2:#e9f2ee; --ink:#14211f; --muted:#5a6d68; --line:#d5e2dc;
  --accent:#078f5a; --accent-ink:#ffffff; --accent-soft:#d6f2e6; --up:#0b8a55; --down:#c23b3b; --warn:#9a6a00; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.nav-in{max-width:1100px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand i{width:3px;height:22px;background:var(--accent);display:block}
.nav a.tab{color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
.nav a.tab[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:800}
h3{font-size:18px;font-weight:600}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 26px;font:600 16px var(--body);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.view{display:grid;gap:22px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:center;min-height:min(560px,70vh)}
.hero p{font-size:17px;max-width:46ch;color:var(--muted)}
.hero video{width:100%;max-width:100%;border-radius:20px;display:block;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.stat{border-left:2px solid var(--accent);padding-left:12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.stat span{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr;min-height:0}.hero video{order:-1}}
/* explore */
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.menu{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;text-decoration:none;color:var(--ink)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#dfe6e9;display:block}
.card div{padding:14px 16px 16px;display:grid;gap:4px}
.card h3{color:var(--ink)}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card:hover h3{color:var(--accent)}
/* tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input,select,textarea{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none;background:var(--surface2)}
th[aria-sort="ascending"]::after{content:" ↑"} th[aria-sort="descending"]::after{content:" ↓"}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.up{color:var(--up)} .down{color:var(--down)}
/* detail */
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.kv div span{display:block;font-size:12.5px;color:var(--muted)}
.kv div b{font-family:var(--mono);font-weight:500;font-size:17px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.bar .t{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.big{font-family:var(--mono);font-size:40px;line-height:1;font-weight:500}
.note{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
/* predictor */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:14px;font-weight:500}
.form small{font-weight:400;color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
/* forum */
.threads{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
@media (max-width:760px){.threads{grid-template-columns:1fr}}
.tlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.tlist button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.tlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.threads>.panel{align-content:start}
.msgs{display:grid;align-content:start;gap:10px;min-height:240px;max-height:420px;overflow:auto}
.msg{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}
.msg b{font-size:12.5px;color:var(--accent)} .msg time{font-size:12px;color:var(--muted);margin-left:6px}
.tlist .cnt{color:var(--muted);font-family:var(--mono);font-size:12px}
.msg .del{all:unset;cursor:pointer;float:right;font-size:12px;color:var(--muted)}
.msg .del:hover,.msg .del:focus-visible{color:var(--down)}
select{cursor:pointer}
[hidden]{display:none!important}
.compose{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px}
@media (max-width:560px){.compose{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const positive=IPOS.filter(d=>gainOpen(d)>0).length;

  return `<section class="hero">

      <div class="eyebrow">Indian IPO analysis</div>

}

let sortKey='listing_date', sortDir=-1, query='', year='all';
const YEARS=[...new Set(IPOS.map(d=>d.listing_date.slice(0,4)))].sort().reverse();
function ipos(){
  setTab('ipos');
  return `<div class="view">
    <div><div class="eyebrow">Mainboard IPOs, ${RANGE}</div><h2>Listed IPOs</h2></div>
    <div class="toolbar"><input id="q" class="input" type="search" placeholder="Search company" aria-label="Search company" value="${esc(query)}" style="flex:1 1 220px">
      <select id="yr" aria-label="Listing year"><option value="all">All years</option>${YEARS.map(y=>`<option value="${y}" ${year===y?'selected':''}>${y}</option>`).join('')}</select>
      <span class="note">Click a row for details. Click a column to sort.</span></div>
    <div class="tablewrap"><table><thead><tr>
      ${[['company','Company',''],['listing_date','Listed',''],['issue_price','Issue price','num'],['issue_size_cr','Issue size (₹ cr)','num'],['qib','QIB (x)','num'],['total','Total sub. (x)','num'],['g_open','Listing open','num'],['g_close','Day close','num']].map(([k,l,c])=>`<th class="${c}" data-k="${k}" ${sortKey===k?`aria-sort="${sortDir>0?'ascending':'descending'}"`:''}>${l}</th>`).join('')}
    </tr></thead><tbody id="rows"></tbody></table></div>
    <p class="note" id="cnt"></p>
    <p class="note">Gains are measured against the issue price. InvITs and REITs are left out. Source: Trendlyne IPO screener.</p></div>`;
}
function fillRows(){
  const val=(d,k)=>k==='g_open'?gainOpen(d):k==='g_close'?gainClose(d):d[k];
  const list=IPOS.filter(d=>d.company.toLowerCase().includes(query.toLowerCase())&&(year==='all'||d.listing_date.startsWith(year)))
    .sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey);return (x>y?1:x<y?-1:0)*sortDir;});
  $('#rows').innerHTML=list.length?list.map(d=>`<tr data-s="${d.slug}" tabindex="0">
    <td>${esc(d.company)}</td><td>${fmtDate(d.listing_date)}</td><td class="num">${inr(d.issue_price)}</td>
    <td class="num">${d.issue_size_cr.toLocaleString('en-IN')}</td><td class="num">${d.qib.toFixed(1)}</td><td class="num">${d.total.toFixed(1)}</td>
    <td class="num ${cls(gainOpen(d))}">${pct(gainOpen(d))}</td><td class="num ${cls(gainClose(d))}">${pct(gainClose(d))}</td></tr>`).join('')
    :`<tr><td colspan="8" class="muted">No company matches “${esc(query)}”.</td></tr>`;
  const up=list.filter(d=>gainOpen(d)>0).length;
  $('#cnt').textContent=list.length?`${list.length} IPOs shown · ${up} opened above issue price · average open gain ${pct(avg(list.map(gainOpen)))}`:'';
}

function detail(d){
  setTab('ipos');
  const p=predict(d.qib), go=gainOpen(d), gc=gainClose(d);
  const max=Math.max(d.qib,d.hni,d.retail,1);
  const bar=(l,v)=>`<div class="bar"><span>${l}</span><div class="t"><i style="width:${Math.max(2,Math.log1p(v)/Math.log1p(max)*100)}%"></i></div><span class="mono" style="text-align:right">${v.toFixed(1)}x</span></div>`;
  return `<div class="view">
    <div><a href="#ipos" class="note">← All IPOs</a></div>
    <div><div class="eyebrow">Listed ${fmtDate(d.listing_date)}</div><h2>${esc(d.company)}</h2></div>
    <div class="grid2">
      <div class="panel">
        <h3>Company IPO details</h3>
        <div class="kv">
          <div><span>Issue price</span><b>${inr(d.issue_price)}</b></div>
          <div><span>Issue size</span><b>₹${d.issue_size_cr.toLocaleString('en-IN')} cr</b></div>
          <div><span>Listing-day open</span><b>${inr(d.listing_open)}</b></div>
          <div><span>Listing-day close</span><b>${inr(d.listing_close)}</b></div>
          <div><span>Gain at open</span><b class="${cls(go)}">${pct(go)}</b></div>
          <div><span>Gain at close</span><b class="${cls(gc)}">${pct(gc)}</b></div>
        </div>
        <h3 style="margin-top:6px">Subscription (demand)</h3>
        <div class="bars">${bar('QIB',d.qib)}${bar('HNI',d.hni)}${bar('Retail',d.retail)}${bar('Total',d.total)}</div>
      </div>
      <div class="panel">
        <h3>Predictor check</h3>
        <div><span class="note">Model estimate from QIB demand of ${d.qib.toFixed(1)}x</span><div class="big ${cls(p)}">${pct(p)}</div></div>
        <div><span class="note">What actually happened at the open</span><div class="big ${cls(go)}">${pct(go)}</div></div>
        <p class="note">Off by ${Math.abs(p-go).toFixed(1)} points. This IPO is part of the data the model learned from, so this is an in-sample check, not a true forecast.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#predict">Open predictor</a><a class="btn ghost" href="#forum" data-thread="${d.slug}">Discuss this IPO</a></div>
      </div>
    </div></div>`;
}

let pq=50, pp=300;
function predictView(){
  setTab('predict');
  return `<div class="view">
    <div><div class="eyebrow">IPO Growth Predictor</div><h2>Estimate a listing-day move</h2></div>
    <div class="grid2">
      <div class="panel">
        <form class="form" id="pf">
          <label for="pqi">QIB subscription (times)<small>Qualified institutional buyers' demand on the final day, e.g. 45.8</small>
            <input class="input" id="pqi" type="number" min="0" step="0.1" value="${pq}" required></label>
          <label for="ppi">Issue price (₹)<small>Upper end of the price band</small>
            <input class="input" id="ppi" type="number" min="1" step="1" value="${pp}" required></label>
        </form>
        <div id="pout"></div>
      </div>
      <div class="panel"><h3>QIB demand vs listing-open gain</h3><div id="chart"></div>
        <p class="note">Each dot is one IPO (${RANGE}). The line is the model. Your estimate is the ring.</p></div>
    </div>
    <div class="panel"><h3>How the model works</h3>
      <p style="margin:0">Linear regression on ${MODEL.n} mainboard IPOs: <span class="mono">gain% = ${MODEL.a} + ${MODEL.b} × ln(1 + QIB)</span>. It explains ${Math.round(MODEL.r2*100)}% of the variation (R² ${MODEL.r2}). Tested leave-one-out, it misses by ${MODEL.mae} points on average, against ${MODEL.baseline} points for simply guessing the average gain.</p>
      <div class="kv">
        <div><span>Forward test: trained on 2024–25 (${MODEL.oot_train_n} IPOs), predicting 2026 (${MODEL.oot_n} IPOs)</span><b>±${MODEL.oot_mae} pts</b></div>
        <div><span>Same test, guessing the 2024–25 average</span><b>±${MODEL.oot_base} pts</b></div>
      </div>
      <p class="note" style="margin:0">Adding HNI and retail subscription cut the error by only about 0.3 points, and issue size added nothing, so the model keeps QIB demand alone. Market mood, grey-market premium and sector are not in the data. For learning only, not investment advice.</p>
    </div></div>`;
}
function updatePredict(){
  const q=Math.max(0,parseFloat($('#pqi').value)||0), price=Math.max(0,parseFloat($('#ppi').value)||0);
  pq=q; pp=price;
  const g=predict(q), lo=g-MODEL.mae, hi=g+MODEL.mae;
  $('#pout').innerHTML=`<div><span class="note">Estimated listing-open gain</span><div class="big ${cls(g)}">${pct(g)}</div></div>
    <div class="note">Typical miss: ±${MODEL.mae} points, so roughly ${pct(lo)} to ${pct(hi)}.</div>
    ${price?`<div><span class="note">Implied opening price</span><div class="mono" style="font-size:22px">${inr(price*(1+g/100))} <span class="note">(range ${inr(Math.max(0,price*(1+lo/100)))} – ${inr(price*(1+hi/100))})</span></div></div>`:''}`;
  drawChart(q,g);
}
function drawChart(q,g){
  const W=520,H=320,L=44,R=14,T=12,B=34;
  const xs=d=>Math.log1p(d), xmax=Math.log1p(400), ymin=-50, ymax=160;
  const X=v=>L+(xs(v)/xmax)*(W-L-R), Y=v=>T+(1-(v-ymin)/(ymax-ymin))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Scatter of QIB subscription against listing-open gain">`;
  [-50,-25,0,25,50,75,100,125,150].forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="${v===0?1.4:0.6}"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`});
  [1,3,10,30,100,300].forEach(v=>{s+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle">${v}x</text>`});
  s+=`<text x="${(L+W-R)/2}" y="${H-1}" text-anchor="middle">QIB subscription (log scale)</text>`;
  IPOS.forEach(d=>{const gy=Math.max(ymin,Math.min(ymax,gainOpen(d)));s+=`<circle cx="${X(Math.min(d.qib,400))}" cy="${Y(gy)}" r="3.5" fill="var(--accent)" fill-opacity=".45"><title>${esc(d.company)}: QIB ${d.qib}x, ${pct(gainOpen(d))}</title></circle>`});
  let path='';for(let i=0;i<=60;i++){const q2=Math.expm1(xmax*i/60);path+=(i?'L':'M')+X(q2).toFixed(1)+','+Y(Math.max(ymin,Math.min(ymax,predict(q2)))).toFixed(1);}
  s+=`<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
  const qc=Math.min(q,400), gc=Math.max(ymin,Math.min(ymax,g));
  s+=`<circle cx="${X(qc)}" cy="${Y(gc)}" r="8" fill="none" stroke="var(--warn)" stroke-width="3"/></svg>`;
  $('#chart').innerHTML=s;
}

/* forum: shared through the artifact's database when available, otherwise this browser only */
let thread='general';
const F={mode:'connecting', db:null, user:null, uid:null, owner:false, canWrite:null, readOnly:false, posts:[], loaded:false, slow:false, err:''};
function loadLocal(){try{return JSON.parse(localStorage.getItem('ipo-forum-v2')||'[]')||[]}catch(e){return []}}
function saveLocal(p){try{localStorage.setItem('ipo-forum-v2',JSON.stringify(p))}catch(e){}}
function onForum(){return (location.hash||'').slice(1)==='forum'}
function goLocal(){F.mode='local'; F.posts=loadLocal(); F.loaded=true; if(onForum()) forumStatus(), renderThread();}
(async()=>{
  const use=window.claude&&typeof window.claude.use==='function'?window.claude.use.bind(window.claude):null;
  if(!use) return goLocal();
  let db=null; try{db=await use('db');}catch(e){}
  if(!db) return goLocal();
  F.db=db; F.mode='shared';
  try{F.user=await use('user');}catch(e){}
  if(F.user){
    try{F.uid=await F.user.id();}catch(e){}
    try{F.owner=!!F.user.isOwner();}catch(e){}
    try{F.canWrite=await F.user.can('data.write');}catch(e){F.canWrite=null}
  }
  const t=setTimeout(()=>{F.slow=true; if(onForum()) forumStatus();},10000);
  db.collection('posts').orderBy('ts','asc').limit(1000).onSnapshot(snap=>{
    F.posts=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){clearTimeout(t); F.slow=false;}
    F.loaded=true;
    if(onForum()){forumStatus(); renderThread(); renderCounts();}
  },e=>{clearTimeout(t); F.err='Shared posts could not be loaded right now.'; F.loaded=true; if(onForum()) forumStatus(), renderThread();});
  if(onForum()) forumStatus();
})();
function forumStatus(){
  const el=$('#fstatus'); if(!el) return;
  const cf=$('#cf');
  let msg;
  if(F.mode==='connecting') msg='Connecting to the shared forum…';
  else if(F.mode==='local') msg='On this version of the site, forum posts are saved only in your own browser.';
  else if(F.err) msg=F.err;
  else if(F.slow) msg='The shared forum is taking a while to answer. Posts shown may be out of date.';
  else msg='Shared forum: everyone who opens this page sees the same posts, live.';
  const ro=F.mode==='shared'&&(F.canWrite===false||F.readOnly);
  if(ro) msg+=' You can read the discussion; posting needs Contributor access from the page owner.';
  el.textContent=msg;
  if(cf) cf.hidden=ro;
}
function forum(){
  setTab('forum');
  const names=[['general','General market discussion'],...IPOS.slice().sort((a,b)=>a.company.localeCompare(b.company)).map(d=>[d.slug,d.company])];
  return `<div class="view"><div><div class="eyebrow">Community</div><h2>IPO Forums</h2></div>
    <p class="note" style="margin:0" id="fstatus" role="status"></p>
    <div class="threads">
      <div class="panel" style="padding:10px"><input class="input" id="tq" type="search" placeholder="Find a thread" aria-label="Find a thread">
        <div class="tlist" id="tlist">${names.map(([s,n])=>`<button type="button" data-t="${s}" aria-pressed="${s===thread}">${esc(n)}<span class="cnt" data-c="${s}"></span></button>`).join('')}</div></div>
      <div class="panel"><h3 id="tt"></h3><div class="msgs" id="msgs"></div>
        <form class="compose" id="cf"><input class="input" id="cn" placeholder="Your name" aria-label="Your name" maxlength="30"><input class="input" id="ct" placeholder="Type your message..." aria-label="Message" maxlength="400" required><button class="btn" type="submit" id="send">Send</button></form>
        <p class="note" id="ferr" role="alert" style="margin:0"></p></div>
    </div></div>`;
}
function renderCounts(){
  const c={}; F.posts.forEach(p=>{c[p.thread]=(c[p.thread]||0)+1});
  document.querySelectorAll('#tlist .cnt').forEach(s=>{const n=c[s.dataset.c]; s.textContent=n?` · ${n}`:'';});
}
const fmtTs=ts=>new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
function renderThread(){
  if(!$('#msgs')) return;
  const list=F.posts.filter(p=>p.thread===thread);
  $('#tt').textContent=thread==='general'?'General market discussion':((bySlug[thread]?.company||'IPO')+' IPO discussion');
  const del=m=>(F.mode==='local'||F.owner||(F.uid&&m.uid===F.uid))?`<button type="button" class="del" data-del="${esc(m.id)}" aria-label="Delete post">Delete</button>`:'';
  $('#msgs').innerHTML=!F.loaded?'<p class="note">Loading posts…</p>':list.length?list.map(m=>`<div class="msg"><b>${esc(m.name||'Guest')}</b><time>${fmtTs(m.ts)}</time>${del(m)}<div>${esc(m.text)}</div></div>`).join(''):'<p class="note">No messages yet. Start the discussion.</p>';
  document.querySelectorAll('#tlist button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===thread));
  const box=$('#msgs'); box.scrollTop=box.scrollHeight;
}
let sending=false;
async function sendPost(){
  const text=$('#ct').value.trim(); if(!text||sending) return;
  const typed=$('#cn').value.trim().slice(0,30), name=typed||'Guest';
  if(typed){try{localStorage.setItem('ipo-forum-name',typed)}catch(e){}}
  const post={thread,name,text:text.slice(0,400),ts:Date.now()};
  $('#ferr').textContent='';
  if(F.mode!=='shared'){ post.id='l'+post.ts; F.posts.push(post); saveLocal(F.posts); $('#ct').value=''; renderThread(); renderCounts(); return; }
  if(F.uid) post.uid=F.uid;
  sending=true; $('#send').disabled=true;
  try{ await F.db.collection('posts').add(post); $('#ct').value=''; }
  catch(e){
    if(e&&e.code==='invalid_argument'){F.readOnly=true; forumStatus();}
    else if(e&&e.code==='quota_exceeded') $('#ferr').textContent='The forum is full right now, so new posts cannot be saved.';
    else $('#ferr').textContent='Your post could not be sent. Please try again in a moment.';
  }
  finally{ sending=false; const b=$('#send'); if(b) b.disabled=false; }
}
async function deletePost(id){
  if(F.mode!=='shared'){ F.posts=F.posts.filter(p=>p.id!==id); saveLocal(F.posts); renderThread(); renderCounts(); return; }
  try{ await F.db.doc('posts/'+id).delete(); }catch(e){ $('#ferr').textContent='That post could not be deleted.'; }
}

function about(){
  setTab('about');
  return `<div class="view" style="max-width:760px">
    <div><div class="eyebrow">About us</div><h2>About the project</h2></div>
    <p style="margin:0">IPOs on the Tip is a web application that helps retail investors in India analyse IPOs and estimate how they will list. It brings together historical IPO data, a prediction model and a community forum in one place.</p>
    <div class="panel"><h3>Our team</h3><ul style="margin:0;padding-left:18px"><li>Augustus Menon (team lead)</li><li>Amaan Shaikh</li><li>Sumith Nankani</li></ul>
      <p class="note" style="margin:0">Built as a college project at Kishinchand Chellaram College, Mumbai (2024–25). The original design and front-end prototype are by the team; this version adds real data and a working predictor.</p></div>
    <div class="panel"><h3>Data</h3><p style="margin:0">${IPOS.length} mainboard IPOs listed between ${RANGE}: issue price, issue size, QIB, HNI and retail subscription, and listing-day open and close prices, from the Trendlyne IPO screener (2024 closing prices cross-checked against Navia). InvITs and REITs are left out. A few early-September 2026 listings could not be retrieved and are missing. Data last updated ${UPDATED}.</p></div>
    <div class="panel"><h3>Model</h3><p style="margin:0">Linear regression of listing-open gain on ln(1 + QIB subscription). R² ${MODEL.r2}; leave-one-out mean absolute error ${MODEL.mae} points against an ${MODEL.baseline}-point baseline. Trained only on 2024–25 IPOs, it predicted the ${MODEL.oot_n} IPOs of 2026 within ${MODEL.oot_mae} points on average. See the Growth Predictor for details.</p></div>
    <p class="note" style="margin:0">For learning only, not investment advice.</p></div>`;
}

function route(){
  const h=(location.hash||'#home').slice(1);
  let html;
  if(h==='explore') html=explore();
  else if(h==='ipos') html=ipos();
  else if(h.startsWith('ipo-') && bySlug[h.slice(4)]) html=detail(bySlug[h.slice(4)]);
  else if(h==='predict') html=predictView();
  else if(h==='forum') html=forum();
  else if(h==='about') html=about();
  else html=home();
  $('#app').innerHTML=html+`<footer>IPOs on the Tip · Data: mainboard IPOs, ${RANGE} (updated ${UPDATED}) · For learning only, not investment advice.</footer>`;
  window.scrollTo(0,0);
  if(h==='ipos'){fillRows();
    $('#q').addEventListener('input',e=>{query=e.target.value;fillRows();});
    document.querySelectorAll('th[data-k]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=k==='company'?1:-1;} document.querySelectorAll('th[data-k]').forEach(x=>x.removeAttribute('aria-sort')); th.setAttribute('aria-sort',sortDir>0?'ascending':'descending'); fillRows();}));
    $('#rows').addEventListener('click',e=>{const tr=e.target.closest('tr[data-s]'); if(tr) location.hash='ipo-'+tr.dataset.s;});
    $('#rows').addEventListener('keydown',e=>{const tr=e.target.closest('tr[data-s]'); if(tr&&e.key==='Enter') location.hash='ipo-'+tr.dataset.s;});
  }
  if(h==='predict'){ $('#pf').addEventListener('input',updatePredict); $('#pf').addEventListener('submit',e=>{e.preventDefault();updatePredict();}); updatePredict(); }
  if(h==='ipos'){ $('#yr').addEventListener('change',e=>{year=e.target.value; fillRows();}); }
  if(h==='forum'){
    forumStatus(); renderThread(); renderCounts();
    try{ $('#cn').value=localStorage.getItem('ipo-forum-name')||''; }catch(e){}
    $('#tlist').addEventListener('click',e=>{const b=e.target.closest('button[data-t]'); if(b){thread=b.dataset.t; renderThread();}});
    $('#tq').addEventListener('input',e=>{const v=e.target.value.toLowerCase(); document.querySelectorAll('#tlist button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(v));});
    $('#cf').addEventListener('submit',e=>{e.preventDefault(); sendPost();});
    $('#msgs').addEventListener('click',e=>{const b=e.target.closest('[data-del]'); if(b) deletePost(b.dataset.del);});
    const sel=document.querySelector(`#tlist button[data-t="${thread}"]`); if(sel){const l=$('#tlist'); l.scrollTop=sel.offsetTop-l.offsetTop-80;}
  }
  document.querySelectorAll('[data-thread]').forEach(a=>a.addEventListener('click',()=>{thread=a.dataset.thread;}));
}
window.addEventListener('hashchange',route);
route();
})();
</script>
